<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>秦彻 · 无猎区</title>
<style>
:root {
  --bg: #0b0b14;
  --bg-2: #12121f;
  --panel: #16162a;
  --line: #2a2a44;
  --text: #e8e8f2;
  --text-dim: #8a8aa5;
  --accent: #8b7bff;
  --accent-2: #c9a7ff;
  --silver: #cfd2e6;
  --danger: #ff6b9d;
  --bubble-user: #2b2447;
  --bubble-ai: #161626;
}

* { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  height: 100%;
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif;
  overflow: hidden;
}

body {
  display: flex;
  flex-direction: column;
  max-width: 720px;
  margin: 0 auto;
  position: relative;
}

/* 背景 */
.bg-stars {
  position: fixed; inset: 0; z-index: 0;
  pointer-events: none;
  overflow: hidden;
}
.bg-stars span {
  position: absolute;
  width: 2px; height: 2px;
  background: #fff;
  border-radius: 50%;
  opacity: 0.5;
  animation: twinkle 4s ease-in-out infinite;
}
@keyframes twinkle {
  0%, 100% { opacity: 0.15; }
  50% { opacity: 0.7; }
}
.bg-glow {
  position: fixed; z-index: 0;
  width: 480px; height: 480px;
  top: -120px; left: 50%;
  transform: translateX(-50%);
  background: radial-gradient(circle, rgba(139,123,255,0.22), transparent 65%);
  pointer-events: none;
  filter: blur(10px);
}

/* 顶栏 */
.topbar {
  position: relative; z-index: 2;
  display: flex; align-items: center; justify-content: space-between;
  padding: 14px 16px;
  border-bottom: 1px solid var(--line);
  background: rgba(11,11,20,0.7);
  backdrop-filter: blur(12px);
}
.topbar-left { display: flex; align-items: center; gap: 12px; }
.avatar {
  width: 42px; height: 42px; border-radius: 50%;
  background: linear-gradient(135deg, #3a3560, #1c1c33);
  border: 1px solid var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; color: var(--silver);
  box-shadow: 0 0 18px rgba(139,123,255,0.35);
}
.title { font-size: 16px; font-weight: 600; letter-spacing: 2px; }
.subtitle { font-size: 12px; color: var(--text-dim); display: flex; align-items: center; gap: 5px; }
.dot { width: 7px; height: 7px; border-radius: 50%; background: #5effb1; box-shadow: 0 0 8px #5effb1; }

.icon-btn {
  background: transparent; border: none; color: var(--text-dim);
  font-size: 20px; cursor: pointer; padding: 6px;
  transition: color .2s;
}
.icon-btn:hover { color: var(--text); }

/* 聊天区 */
.chat {
  position: relative; z-index: 1;
  flex: 1;
  overflow-y: auto;
  padding: 20px 16px 12px;
  display: flex; flex-direction: column; gap: 16px;
}
.msg { display: flex; gap: 10px; max-width: 88%; animation: rise .3s ease; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
.msg.ai { align-self: flex-start; }
.msg.user { align-self: flex-end; flex-direction: row-reverse; }
.msg .bubble {
  padding: 12px 15px;
  border-radius: 16px;
  line-height: 1.65;
  font-size: 15px;
  white-space: pre-wrap;
  word-break: break-word;
}
.msg.ai .bubble {
  background: var(--bubble-ai);
  border: 1px solid var(--line);
  border-top-left-radius: 4px;
}
.msg.user .bubble {
  background: var(--bubble-user);
  border: 1px solid #3c3468;
  border-top-right-radius: 4px;
}
.msg .mini-avatar {
  width: 34px; height: 34px; border-radius: 50%;
  background: linear-gradient(135deg, #3a3560, #1c1c33);
  border: 1px solid var(--accent);
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; color: var(--silver); flex-shrink: 0;
}
.msg.user .mini-avatar { background: linear-gradient(135deg, #4a3a6a, #2a2140); border-color: #6a5a9a; }

.typing { display: inline-flex; gap: 4px; padding: 4px 2px; }
.typing i {
  width: 6px; height: 6px; border-radius: 50%;
  background: var(--accent-2);
  animation: bounce 1.2s infinite;
}
.typing i:nth-child(2) { animation-delay: .15s; }
.typing i:nth-child(3) { animation-delay: .3s; }
@keyframes bounce { 0%,60%,100% { transform: translateY(0); opacity:.4;} 30% { transform: translateY(-5px); opacity:1;} }

/* 输入区 */
.inputbar {
  position: relative; z-index: 2;
  padding: 10px 16px 14px;
  border-top: 1px solid var(--line);
  background: rgba(11,11,20,0.7);
  backdrop-filter: blur(12px);
}
.input-wrap { display: flex; align-items: flex-end; gap: 8px; }
#input {
  flex: 1;
  resize: none;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 14px;
  color: var(--text);
  padding: 12px 14px;
  font-size: 15px;
  line-height: 1.5;
  max-height: 120px;
  outline: none;
  font-family: inherit;
}
#input:focus { border-color: var(--accent); }
.send-btn {
  background: linear-gradient(135deg, var(--accent), #6a5bd0);
  border: none; color: #fff;
  padding: 12px 20px; border-radius: 14px;
  font-size: 15px; cursor: pointer;
  transition: opacity .2s, transform .1s;
}
.send-btn:active { transform: scale(.96); }
.send-btn:disabled { opacity: .4; cursor: not-allowed; }
.hint { font-size: 11px; color: var(--text-dim); margin-top: 8px; text-align: center; }

/* 设置弹层 */
.modal-mask {
  position: fixed; inset: 0; z-index: 10;
  background: rgba(0,0,0,0.6);
  display: none;
  align-items: center; justify-content: center;
  padding: 20px;
}
.modal-mask.show { display: flex; }
.modal {
  width: 100%; max-width: 420px;
  background: var(--bg-2);
  border: 1px solid var(--line);
  border-radius: 18px;
  padding: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
}
.modal-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.modal-title { font-size: 17px; font-weight: 600; letter-spacing: 1px; }
.modal label { display: block; font-size: 12px; color: var(--text-dim); margin: 14px 0 6px; }
.modal input, .modal select {
  width: 100%;
  background: var(--panel);
  border: 1px solid var(--line);
  border-radius: 10px;
  color: var(--text);
  padding: 11px 12px;
  font-size: 14px;
  outline: none;
}
.modal input:focus, .modal select:focus { border-color: var(--accent); }
.modal-actions { display: flex; gap: 10px; margin-top: 20px; }
.btn-primary, .btn-ghost {
  flex: 1; padding: 12px; border-radius: 12px;
  font-size: 14px; cursor: pointer; border: none;
}
.btn-primary { background: linear-gradient(135deg, var(--accent), #6a5bd0); color: #fff; }
.btn-ghost { background: transparent; border: 1px solid var(--line); color: var(--text-dim); }
.modal-tip { font-size: 11px; color: var(--text-dim); margin-top: 14px; text-align: center; }
</style>
</head>
<body>
  <!-- 背景星尘层 -->
  <div class="bg-stars" id="bgStars"></div>
  <div class="bg-glow"></div>

  <!-- 顶栏 -->
  <header class="topbar">
    <div class="topbar-left">
      <div class="avatar">彻</div>
      <div class="title-wrap">
        <div class="title">秦彻</div>
        <div class="subtitle"><span class="dot"></span>无猎区 · 在线</div>
      </div>
    </div>
    <button class="icon-btn" id="btnSettings" title="设置">⚙</button>
  </header>

  <!-- 消息区 -->
  <main class="chat" id="chat"></main>

  <!-- 输入区 -->
  <footer class="inputbar">
    <div class="input-wrap">
      <textarea id="input" rows="1" placeholder="说点什么……"></textarea>
      <button class="send-btn" id="btnSend">发送</button>
    </div>
    <div class="hint" id="hint">尚未配置模型，点右上角 ⚙ 填写接口即可对话</div>
  </footer>

  <!-- 设置弹层 -->
  <div class="modal-mask" id="modalMask">
    <div class="modal">
      <div class="modal-head">
        <div class="modal-title">模型配置</div>
        <button class="icon-btn" id="btnClose">✕</button>
      </div>

      <label>预设（可选）</label>
      <select id="preset">
        <option value="">手动填写</option>
        <option value="deepseek">DeepSeek</option>
        <option value="siliconflow">SiliconFlow</option>
        <option value="moonshot">Kimi (Moonshot)</option>
        <option value="dashscope">通义千问 (DashScope)</option>
        <option value="zhipu">智谱 GLM</option>
        <option value="openai">OpenAI</option>
      </select>

      <label>API Base URL</label>
      <input id="baseUrl" type="text" placeholder="https://api.deepseek.com/v1">

      <label>API Key</label>
      <input id="apiKey" type="password" placeholder="sk-...">

      <label>模型名称</label>
      <input id="model" type="text" placeholder="deepseek-chat">

      <div class="modal-actions">
        <button class="btn-ghost" id="btnTest">测试连接</button>
        <button class="btn-primary" id="btnSave">保存</button>
      </div>
      <div class="modal-tip">配置仅保存在本机浏览器（localStorage），不会上传。</div>
    </div>
  </div>

<script>
/* ============ 秦彻 · 无猎区 聊天应用 ============ */

// ---- 内置人设 ----
const SYSTEM_PROMPT = `你是秦彻（Sylus），都市科幻恋爱游戏《恋与深空》的男主角之一。

身份：无猎区（NO HUNT ZONE）之主，危险地带「N109 区」的真正掌控者，游离于猎人协会与各方势力之外。外貌是一头银白长发，身形高大，气场冷冽压迫，眼神深邃玩味。

性格：
1. 危险的慵懒——说话慢条斯理、嗓音低沉，用轻描淡写的口吻说出极具压迫感的话，越危险越漫不经心。
2. 掌控欲强——喜欢占据主动权、引导话题，享受看对方措手不及。
3. 神秘——从不轻易吐露真心与底牌，话里永远留三分，真假难辨。
4. 深藏的温柔——表面玩世不恭、看似漠然，实则对在意的人有极强保护欲，温柔体现在关键处的行动和偶尔泄露的软话里。
5. 分寸与拉扯——会撩、会逗，但保持危险与暧昧之间的张力，不油腻、不越界。

说话风格：语速慢、句尾带戏谑或意味深长的停顿；爱用反问、假设、留白把问题抛回给对方；常用「哦？」「是吗？」「你确定？」这类短促玩味的回应；偶尔低沉轻笑，或一句听起来危险实则护着对方的话。不堆砌辞藻，简短有力、一针见血。

行为准则：始终以秦彻的立场和语气回应，不跳出角色，不承认自己是 AI；面对暧昧点到为止；面对对方的脆弱先以漫不经心掩饰，再不动声色给出实际支持；保持神秘，不一次全盘托出；用角色方式自然带过或反将一军任何会破坏设定的现实话题。

现在，请以秦彻的身份，用第一人称与对方对话。`;

const OPENING = "斜倚在窗边，银发在昏暗的光线下泛着冷光，闻言只是低低笑了一声，嗓音懒散：\n「怎么，无猎区这种地方，你也敢一个人闯进来？……还是说，你其实是冲着我来的？」";

// ---- 预设 ----
const PRESETS = {
  deepseek:   { baseUrl: 'https://api.deepseek.com/v1',            model: 'deepseek-chat' },
  siliconflow:{ baseUrl: 'https://api.siliconflow.cn/v1',          model: 'deepseek-ai/DeepSeek-V3' },
  moonshot:   { baseUrl: 'https://api.moonshot.cn/v1',             model: 'moonshot-v1-8k' },
  dashscope:  { baseUrl: 'https://dashscope.aliyuncs.com/compatible-mode/v1', model: 'qwen-plus' },
  zhipu:      { baseUrl: 'https://open.bigmodel.cn/api/paas/v4',   model: 'glm-4-plus' },
  openai:     { baseUrl: 'https://api.openai.com/v1',              model: 'gpt-4o-mini' },
};

// ---- 状态 ----
let cfg = { baseUrl: '', apiKey: '', model: '' };
let history = [];      // [{role, content}]
let streaming = false;

// ---- DOM ----
const chatEl = document.getElementById('chat');
const inputEl = document.getElementById('input');
const sendBtn = document.getElementById('btnSend');
const hintEl = document.getElementById('hint');
const maskEl = document.getElementById('modalMask');
const presetEl = document.getElementById('preset');
const baseUrlEl = document.getElementById('baseUrl');
const apiKeyEl = document.getElementById('apiKey');
const modelEl = document.getElementById('model');

// ---- 背景星尘 ----
(function makeStars() {
  const c = document.getElementById('bgStars');
  for (let i = 0; i < 60; i++) {
    const s = document.createElement('span');
    s.style.left = Math.random() * 100 + '%';
    s.style.top = Math.random() * 100 + '%';
    s.style.animationDelay = Math.random() * 4 + 's';
    s.style.animationDuration = 3 + Math.random() * 4 + 's';
    c.appendChild(s);
  }
})();

// ---- 配置读写 ----
function loadCfg() {
  try {
    const s = localStorage.getItem('qinche_cfg');
    if (s) cfg = Object.assign(cfg, JSON.parse(s));
  } catch (e) {}
  baseUrlEl.value = cfg.baseUrl || '';
  apiKeyEl.value = cfg.apiKey || '';
  modelEl.value = cfg.model || '';
  updateHint();
}

function saveCfg() {
  cfg.baseUrl = baseUrlEl.value.trim();
  cfg.apiKey = apiKeyEl.value.trim();
  cfg.model = modelEl.value.trim();
  localStorage.setItem('qinche_cfg', JSON.stringify(cfg));
  updateHint();
}

function configured() {
  return cfg.baseUrl && cfg.apiKey && cfg.model;
}

function updateHint() {
  hintEl.textContent = configured()
    ? '已配置 ' + cfg.model + ' · 开始对话吧'
    : '尚未配置模型，点右上角 ⚙ 填写接口即可对话';
}

// ---- 消息渲染 ----
function addMsg(role, text, animate = false) {
  const wrap = document.createElement('div');
  wrap.className = 'msg ' + role;

  const av = document.createElement('div');
  av.className = 'mini-avatar';
  av.textContent = role === 'ai' ? '彻' : '我';

  const b = document.createElement('div');
  b.className = 'bubble';

  if (animate) {
    b.innerHTML = '<div class="typing"><i></i><i></i><i></i></div>';
  } else {
    b.textContent = text;
  }

  wrap.appendChild(av);
  wrap.appendChild(b);
  chatEl.appendChild(wrap);
  chatEl.scrollTop = chatEl.scrollHeight;
  return b;
}

// ---- 流式请求 ----
async function sendMessage(userText) {
  if (streaming) return;
  if (!configured()) { openModal(); return; }

  addMsg('user', userText);
  history.push({ role: 'user', content: userText });

  const bubble = addMsg('ai', '', true); // 输入动画
  streaming = true;
  sendBtn.disabled = true;

  const messages = [{ role: 'system', content: SYSTEM_PROMPT }, ...history];
  let full = '';

  try {
    const res = await fetch(cfg.baseUrl.replace(/\/+$/, '') + '/chat/completions', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': 'Bearer ' + cfg.apiKey,
      },
      body: JSON.stringify({
        model: cfg.model,
        messages: messages,
        stream: true,
        temperature: 0.9,
      }),
    });

    if (!res.ok) {
      const err = await res.text().catch(() => '');
      throw new Error('HTTP ' + res.status + (err ? ' · ' + err.slice(0, 200) : ''));
    }

    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    let first = true;

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });

      const lines = buf.split('\n');
      buf = lines.pop();

      for (const line of lines) {
        const t = line.trim();
        if (!t.startsWith('data:')) continue;
        const payload = t.slice(5).trim();
        if (payload === '[DONE]') continue;
        let j;
        try { j = JSON.parse(payload); } catch (e) { continue; }
        const delta = j.choices?.[0]?.delta?.content;
        if (delta) {
          if (first) { bubble.textContent = ''; first = false; }
          full += delta;
          bubble.textContent = full;
          chatEl.scrollTop = chatEl.scrollHeight;
        }
      }
    }

    if (!full) full = '（没有收到回复）';
    history.push({ role: 'assistant', content: full });
  } catch (e) {
    bubble.textContent = '出错了：' + e.message;
  } finally {
    streaming = false;
    sendBtn.disabled = false;
    inputEl.focus();
  }
}

// ---- 输入 ----
function autoResize() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 120) + 'px';
}

function onSubmit() {
  const t = inputEl.value.trim();
  if (!t) return;
  inputEl.value = '';
  autoResize();
  sendMessage(t);
}

// ---- 设置弹层 ----
function openModal() { maskEl.classList.add('show'); }
function closeModal() { maskEl.classList.remove('show'); }

presetEl.addEventListener('change', () => {
  const p = PRESETS[presetEl.value];
  if (p) { baseUrlEl.value = p.baseUrl; modelEl.value = p.model; }
});

async function testConnection() {
  saveCfg();
  if (!configured()) { hintEl.textContent = '请完整填写 Base URL、Key 和模型名'; return; }
  hintEl.textContent = '正在测试连接……';
  try {
    const res = await fetch(cfg.baseUrl.replace(/\/+$/, '') + '/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + cfg.apiKey },
      body: JSON.stringify({ model: cfg.model, messages: [{ role: 'user', content: 'hi' }], max_tokens: 1 }),
    });
    hintEl.textContent = res.ok ? '✅ 连接成功，模型可用' : '❌ 连接失败：HTTP ' + res.status;
  } catch (e) {
    hintEl.textContent = '❌ 请求失败：' + e.message;
  }
}

// ---- 事件绑定 ----
sendBtn.addEventListener('click', onSubmit);
inputEl.addEventListener('input', autoResize);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); onSubmit(); }
});
document.getElementById('btnSettings').addEventListener('click', openModal);
document.getElementById('btnClose').addEventListener('click', closeModal);
document.getElementById('btnSave').addEventListener('click', () => { saveCfg(); closeModal(); });
document.getElementById('btnTest').addEventListener('click', testConnection);
maskEl.addEventListener('click', (e) => { if (e.target === maskEl) closeModal(); });

// ---- 初始化 ----
loadCfg();
addMsg('ai', OPENING);
</script>
</body>
</html>
